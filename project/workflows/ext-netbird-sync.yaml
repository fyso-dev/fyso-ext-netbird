description: Make this project's web addresses reach this NetBird peer, by DNS records or reverse proxy services (plan by default)
type: graph
max_active_runs: 1
params:
  - APPLY: "false"           # true creates what is missing and updates what drifted; never deletes
working_dir: ${FYSO_ROOT}
steps:
  - id: sync
    command: |
      case "${APPLY}" in
        true) framework/scripts/run-ext.sh netbird -- node extensions/netbird/netbird.cjs apply ;;
        false) framework/scripts/run-ext.sh netbird -- node extensions/netbird/netbird.cjs plan ;;
        *) echo "APPLY must be true or false" >&2; exit 1 ;;
      esac
