description: Point this project's web addresses at this NetBird peer (plan by default)
type: graph
max_active_runs: 1
params:
  - APPLY: "false"           # true creates missing DNS records and updates drifted ones
working_dir: ${FYSO_ROOT}
steps:
  - id: sync
    command: |
      case "${APPLY}" in
        true) framework/scripts/run-ext.sh netbird -- node extensions/netbird/netbird.cjs apply ;;
        false) framework/scripts/run-ext.sh netbird -- node extensions/netbird/netbird.cjs plan ;;
        *) echo "APPLY must be true or false" >&2; exit 1 ;;
      esac
